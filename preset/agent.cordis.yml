# The `oh-my-dsh` preset: a fixed Minimal model surface with a replaceable
# execution layer.  The main agent always sees bash, str_replace_editor, and
# web_search; capabilities are described as short plugin messages and remain
# executable through `dshx` over bash.

# ── fixed model contract ────────────────────────────────────────────────────

# Keep this text byte-identical to the official Minimal preset.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# ── persistent bash ─────────────────────────────────────────────────────────

# The tool contract is the official Minimal `bash` tool.  Linux keeps the
# Harness PTY provider; Windows uses the stdio MSYS2 provider below and never
# exposes a PowerShell tool or PowerShell instructions to the model.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash-linux
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        shellPath: /bin/bash
        shellArgs: [--noprofile, --norc, -i]
        timeoutMs: 300000

    - id: terminal-bash-windows
      name: ./windows-msys2.mjs
      disabled: !!js process.platform !== 'win32'
      config:
        workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()
        shellPath: !!js process.env.DSH_MSYS2_BASH ?? ''
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        backendType: shell
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# ── filesystem ──────────────────────────────────────────────────────────────

- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# ── resident web search ─────────────────────────────────────────────────────

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: false
    searchTimeoutMs: 60000

# ── multi-turn anchor and hidden capability route ───────────────────────────

# This is a pre-step message transformation, not a persona switch.  It runs
# only for top-level real user messages after the first one and is durable.
- id: turn-anchor
  name: ./anchor/turn-anchor.mjs

# Durable event-log recovery.  The compaction replacement contains only
# bounded objective facts; it does not add a behavioral instruction prefix.
- id: session-recovery
  name: cordis:group
  group: true
  isolate:
    ohMyDshRecovery: true
  config:
    - id: durable-session-recovery
      name: ./events/recovery.mjs
      config:
        maxSurfaceNodes: 32
        retainSurfaceNodes: 8
        maxSurfaceChars: 24000
        maxRequirements: 8
        maxChangedFiles: 32
        maxTestConclusions: 16
        maxLedgerItems: 32
        maxFactChars: 12000

# The router has no model-facing tools and uses a fresh V4 Flash call when the
# host LLM service is available.  A failure keeps the last validated choice or
# no capability at all; it never opens a Standard catalog.
- id: capability-runtime
  name: cordis:group
  group: true
  isolate:
    ohMyDshCapabilities: true
    ohMyDshRouter: true
    ohMyDshNativeSurface: true
  config:
    # The model-facing catalog filter shares this private surface with the
    # router so a selected bundle can affect the same request assembly.
    - id: minimal-surface
      name: ./minimal-surface.mjs
      config:
        tools: [bash, str_replace_editor, web_search]

    - id: capability-runtime-plugin
      name: ./capability-runtime.mjs
      config:
        # Stage 6 is an opt-in compatibility outlet. Keep the default model
        # surface at the three Minimal tools unless a preset explicitly adds
        # allowlisted native bundles here.
        nativeTools:
          enabled: false
          bundles: []
        router:
          provider: !!js process.env.DSH_ROUTER_PROVIDER ?? 'deepseek-official'
          model: !!js process.env.DSH_ROUTER_MODEL ?? 'deepseek-v4-flash'
          maxTokens: 2048
          reasoningEffort: 'off'

# The initial turn-anchor is a context-only model request.  Keep every
# top-level tool schema hidden until that request has produced a durable
# assistant/message; subagents retain their tools from their first request.
- id: zero-tool-bootstrap
  name: ./zero-tool-bootstrap.mjs
